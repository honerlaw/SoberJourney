on:
  push:
    branches:
      - main
concurrency:
  # One deploy at a time; a queued run is not cancelled by the next merge.
  group: eas-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: 🚀 Publish an EAS Update, or build and submit when native code changed
        run: packages/app/scripts/eas-deploy.sh deploy